name: Production Microservices CI/CD Pipeline

on:
  push:
    branches: [ "feature/jfrog-pipeline" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Backend Build & Push to Local JFrog
    - name: Build Backend Docker Image
      run: |
        docker build -t localhost:8082/docker-local/backend-service:latest ./backend

    # Frontend Build & Push to Local JFrog
    - name: Build Frontend Docker Image
      run: |
        docker build -t localhost:8082/docker-local/frontend-service:latest ./frontend

    - name: Login to JFrog Artifactory
      uses: docker/login-action@v2
      with:
        registry: localhost:8082
        username: admin
        password: password

    - name: Push Backend Image to JFrog
      run: |
        docker push localhost:8082/docker-local/backend-service:latest

    - name: Push Frontend Image to JFrog
      run: |
        docker push localhost:8082/docker-local/frontend-service:latest